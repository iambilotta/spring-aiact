name: release

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  publish:
    name: publish to Maven Central
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: maven
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify the release tag matches the pom version
        env:
          GH_TAG: ${{ github.event.release.tag_name }}
        run: |
          POM_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null \
            || mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          EXPECTED="${GH_TAG#v}"
          if [ "$POM_VERSION" != "$EXPECTED" ]; then
            echo "::error::Tag $GH_TAG (expected pom version $EXPECTED) != pom $POM_VERSION"
            exit 1
          fi

      - name: Build, sign and publish the bundle
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn -B -ntp -V -P release \
              -pl '!spring-aiact-sample' -am \
              -DskipTests \
              deploy
