name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
    name: build (java ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java }}
          cache: maven

      # The reactor builds the maven-plugin module first; its descriptor is
      # generated at process-classes, which is required before the sample
      # module can resolve the plugin. We therefore run the full verify
      # lifecycle here rather than splitting compile / test / verify.
      - name: Build, test and run plugin against sample
        run: mvn -B -ntp -V verify

      - name: Upload generated docs (sample)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-docs-jdk${{ matrix.java }}
          path: spring-aiact-sample/target/generated-docs/
          if-no-files-found: ignore

      - name: Upload coverage report (jacoco aggregate)
        if: always() && matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-jacoco-aggregate
          path: spring-aiact-sample/target/site/jacoco-aggregate/
          if-no-files-found: warn

      - name: Generate coverage badge
        if: matrix.java == '21' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: spring-aiact-sample/target/site/jacoco-aggregate/jacoco.csv
          coverage-badge-filename: jacoco.svg
          generate-coverage-badge: true
          badges-directory: .github/badges

  dependency-check:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: maven
      - name: OWASP Dependency-Check
        run: mvn -B -ntp -V -Pdependency-check verify -DskipTests
        continue-on-error: true

  # Living requirements (tracegate dogfood): the committed `*/_generated/`
  # catalog is derived from the test suite; this gate fails if it drifts from
  # the code. Additive and independent of the Java build. To fix a drift,
  # regenerate locally (`make requirements`) and commit — never hand-edit a
  # `_generated/*` file. tracegate is pinned to a commit so the gate is stable.
  tracegate:
    name: tracegate drift-gate
    runs-on: ubuntu-latest
    env:
      # Single source of the pin: the Makefile's TRACEGATE_REF. CI runs the SAME pinned uvx
      # invocation as the local hooks (uvx --from git+...@TRACEGATE_REF tracegate), so a stale
      # PATH install can never make local and CI disagree.
      TRACEGATE_REF: 3bb94964f1e0502d2e68681611bf5ac335180f4b
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Drift-gate the requirements catalog (pinned tracegate via uvx)
        run: uvx --from "git+https://github.com/iambilotta/tracegate@${TRACEGATE_REF}" tracegate . --check
