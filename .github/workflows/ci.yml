name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
    name: build (java ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java }}
          cache: maven

      # The reactor builds the maven-plugin module first; its descriptor is
      # generated at process-classes, which is required before the sample
      # module can resolve the plugin. We therefore run the full verify
      # lifecycle here rather than splitting compile / test / verify.
      - name: Build, test and run plugin against sample
        run: mvn -B -ntp -V verify

      - name: Upload generated docs (sample)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-docs-jdk${{ matrix.java }}
          path: spring-aiact-sample/target/generated-docs/
          if-no-files-found: ignore

  dependency-check:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: maven
      - name: OWASP Dependency-Check
        run: mvn -B -ntp -V -Pdependency-check verify -DskipTests
        continue-on-error: true
