# pre-commit framework config (https://pre-commit.com). Declarative, every tool version
# PINNED, hooks auto-installed in isolated envs. Installed by `make setup`.
#
# Install once per clone:   make setup   (-> scripts/install-git-hooks.sh)
# Run on demand:            pre-commit run --all-files
# Update pins:              pre-commit autoupdate   (then review + commit)
#
# Responsibility map:
#   1. requirements catalog regen + auto-stage  -> local hook, delegates to the pinned
#                                                  tracegate CLI (github.com/iambilotta/tracegate,
#                                                  pinned by Makefile TRACEGATE_REF; installed
#                                                  by `make setup`). Fires on commit AND after
#                                                  every tree-mutating integration op.
#   2. conventional commit message              -> official conventional-pre-commit hook (pinned)
#   3. secrets scan                             -> official gitleaks hook (pinned)
#   4. shell script lint                        -> official shellcheck hook (pinned)

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # commit history IS the changelog source; conventional format keeps it machine-readable

  - repo: local
    hooks:
      - id: regen-generated-docs
        name: regenerate every module's _generated/*.md + auto-stage
        # Idempotent: clean tree -> byte-identical output -> no-op. The generator is the
        # pinned tracegate CLI (Makefile TRACEGATE_REF, installed via `make setup`); running
        # it on every commit is what makes the catalog unable to drift.
        entry: scripts/hooks/regen-docs-and-stage.sh
        language: script
        always_run: true
        pass_filenames: false

      - id: regen-generated-docs-on-integration
        name: regenerate _generated/*.md + auto-stage (after merge/rebase/cherry-pick)
        # ADR sw-scm-007: _generated/* is a WHOLE-TREE derived artifact. The pre-commit hook
        # above fires only on `git commit`; merge / pull / rebase-pick / cherry-pick REPLAY
        # existing commits and bypass it, so integrating several branches yields an HEAD whose
        # _generated was regenerated against the union by nobody. These two post-* stages run
        # the SAME pinned-tracegate regen + auto-stage after every tree-mutating integration
        # op, so the integrated HEAD is consistent without a manual `make requirements`.
        # Idempotent: no change in the tree -> no-op (and the hooks run AFTER the operation,
        # so they only stage the regen for the next commit, never create a commit themselves).
        entry: scripts/hooks/regen-docs-and-stage.sh
        language: script
        stages: [post-merge, post-rewrite]
        always_run: true
        pass_filenames: false
