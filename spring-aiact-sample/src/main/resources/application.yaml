server:
  port: 8081

spring:
  main:
    banner-mode: off

aiact:
  enabled: true
  log-dir: ${java.io.tmpdir}/spring-aiact-sample
  retention: P10Y
  hmac:
    secret: sample-secret-please-override
  endpoints:
    enabled: true
    base-path: /aiact
    # The sample is meant to be runnable on a developer laptop, so the unsafe
    # permit-all guard is on. NEVER copy this line into a production config.
    allow-without-guard: true
  retention-sweeper:
    enabled: false

logging:
  level:
    com.iambilotta.spring.aiact: INFO
