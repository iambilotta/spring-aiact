# JitPack build configuration. JitPack runs the install command on the tag; we
# override it to use the Maven Wrapper so we get a modern Maven (3.9.15) instead
# of JitPack's built-in 3.0.5. The wrapper auto-downloads on first use.
#
# JDK 21 LTS is the minimum baseline declared in the parent pom.

jdk:
  - openjdk21

before_install:
  - chmod +x ./mvnw

install:
  - ./mvnw -B -ntp install -pl '!spring-aiact-sample' -am -DskipTests
