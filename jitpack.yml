# JitPack build configuration. JitPack runs `mvn install` on the tag; we override
# the install command to skip the sample module (it is a runnable demo, not a
# library) and skip tests (CI already enforces them on the matching commit).
#
# JDK 21 LTS is the minimum baseline declared in the parent pom.

jdk:
  - openjdk21

install:
  - mvn -B -ntp install -pl '!spring-aiact-sample' -am -DskipTests
